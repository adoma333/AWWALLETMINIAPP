# AW Wallet — written by setup.sh (certbot adds the HTTPS part)
limit_req_zone $binary_remote_addr zone=aw_api:10m rate=20r/s;

server {
    listen 80;
    listen [::]:80;
    server_name __DOMAIN__;

    root __APP_DIR__/frontend/dist;
    index index.html;
    client_max_body_size 10m;
    server_tokens off;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;

    # API + Telegram webhook
    location /api/ {
        limit_req zone=aw_api burst=60 nodelay;
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
    location = /tonconnect-manifest.json {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
    }

    # hashed build assets → cache forever
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }
    location = /version.json {
        add_header Cache-Control "no-store";
        try_files $uri =404;
    }

    # admin panel (second page of the same build)
    location /admin/ {
        add_header Cache-Control "no-store";
        add_header X-Frame-Options SAMEORIGIN always;
        try_files $uri /admin/index.html;
    }

    # mini app (hash router)
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }
}
