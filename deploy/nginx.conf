# Zohra Wallet — written by setup.sh (certbot adds the HTTPS part)
limit_req_zone $binary_remote_addr zone=aw_api:10m rate=20r/s;

server {
    listen 80;
    listen [::]:80;
    server_name __DOMAIN__;

    root __APP_DIR__/frontend/dist;
    index index.html;
    client_max_body_size 10m;
    server_tokens off;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;

    # API + Telegram webhook
    location /api/ {
        limit_req zone=aw_api burst=60 nodelay;
        proxy_pass http://127.0.0.1:__PORT__;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
    # app builds uploaded by GitHub Actions (APK / Windows / macOS) and their downloads
    location ^~ /api/releases/upload/ {
        client_max_body_size 400m;
        proxy_request_buffering off;
        proxy_read_timeout 600s;
        proxy_pass http://127.0.0.1:__PORT__;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
    location /dl/ {
        alias __APP_DIR__/releases/;
        add_header Content-Disposition "attachment" always;
        add_header X-Content-Type-Options nosniff always;
        types { application/vnd.android.package-archive apk; application/zip zip; }
        default_type application/octet-stream;
        location ~ \.(json|part)$ { return 404; }
    }

    # live prices (server-sent events): unbuffered, long-lived
    location = /api/prices/stream {
        proxy_pass http://127.0.0.1:__PORT__;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
    }
    location = /tonconnect-manifest.json {
        proxy_pass http://127.0.0.1:__PORT__;
        proxy_set_header Host $host;
    }

    # on-device OCR engine for identity scans (large, rarely changes)
    location /ocr/ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
    }

    # hashed build assets → cache forever
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }
    location = /version.json {
        add_header Cache-Control "no-store";
        try_files $uri =404;
    }

    # admin panel (second page of the same build)
    location /admin/ {
        add_header Cache-Control "no-store";
        add_header X-Frame-Options SAMEORIGIN always;
        try_files $uri /admin/index.html;
    }

    # download page
    location /get/ {
        add_header Cache-Control "no-cache";
        try_files $uri /get/index.html;
    }

    # mini app (hash router)
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }
}
