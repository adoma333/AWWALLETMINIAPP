<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
    <title>ZOHRA WALLET</title>
    <meta name="description" content="ZOHRA WALLET — send, swap, buy and gift crypto on every major network, right inside Telegram." />
    <meta name="theme-color" content="#000000" />
    <meta name="color-scheme" content="dark light" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Zohra" />
    <meta property="og:title" content="ZOHRA WALLET" />
    <meta property="og:description" content="Your crypto wallet inside Telegram." />
    <meta property="og:image" content="/og.png" />
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
      /* first paint — before any JavaScript: the mark assembles itself and keeps a soft pulse until the wallet is ready */
      html, body { margin: 0; background: #000; }
      .splash { position: fixed; inset: 0; z-index: 999; background: var(--sbg, #000); display: grid; place-items: center; overflow: hidden;
        transition: opacity .32s ease, visibility .32s; }
      .splash .wrap { position: relative; width: 104px; height: 104px; transition: transform .36s cubic-bezier(.4, 0, .2, 1); }
      .splash .halo { position: absolute; inset: -46px; border-radius: 50%; background: radial-gradient(closest-side, rgba(255, 106, 0, .38), transparent); animation: shalo 1.6s ease-in-out infinite; }
      .splash .orbit { position: absolute; inset: -18px; border-radius: 50%; border: 2px solid transparent; border-top-color: #FF8A00; border-right-color: rgba(255, 138, 0, .35);
        animation: sspin 1.1s linear infinite, sfade .4s ease-out .5s both; }
      .splash .mark { position: relative; width: 104px; height: 104px; filter: drop-shadow(0 16px 36px rgba(255, 90, 0, .5)); animation: sbreathe 1.6s ease-in-out .8s infinite; }
      .splash .sq { transform-origin: 32px 32px; animation: spop .5s cubic-bezier(.2, 1.5, .4, 1) both; }
      .splash .b1 { animation: sl .42s cubic-bezier(.2, .9, .3, 1) .16s both; } .splash .b2 { animation: sr .42s cubic-bezier(.2, .9, .3, 1) .24s both; }
      .splash .pt { transform-origin: 18px 45px; animation: sbloom .5s cubic-bezier(.2, 1.4, .4, 1) .36s both; }
      .splash.done { opacity: 0; visibility: hidden; pointer-events: none; }
      .splash.done .wrap { transform: scale(1.35); }
      @keyframes spop { from { transform: scale(.3) rotate(-12deg); opacity: 0; } }
      @keyframes sl { from { transform: translateX(-30px); opacity: 0; } } @keyframes sr { from { transform: translateX(30px); opacity: 0; } }
      @keyframes sbloom { from { transform: scale(0) rotate(-25deg); opacity: 0; } }
      @keyframes sbreathe { 50% { transform: scale(1.06) rotate(-2deg); } }
      @keyframes shalo { 50% { transform: scale(1.12); opacity: .6; } }
      @keyframes sspin { to { transform: rotate(360deg); } } @keyframes sfade { from { opacity: 0; } }
      @media (prefers-reduced-motion: reduce) { .splash * { animation-duration: .01s !important; animation-iteration-count: 1 !important; } }
    </style>
  </head>
  <body>
    <div class="splash" id="splash" aria-label="ZOHRA WALLET">
      <div class="wrap"><span class="halo"></span><span class="orbit"></span>
        <svg class="mark" viewBox="0 0 64 64"><defs><linearGradient id="sg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FF9A1A"/><stop offset="1" stop-color="#FF4D00"/></linearGradient></defs>
          <rect class="sq" width="64" height="64" rx="20.5" fill="url(#sg)"/>
          <path class="b1" d="M17 15.5h30a3.5 3.5 0 0 1 0 7H17a3.5 3.5 0 0 1 0-7z" fill="#160800"/><path class="b2" d="M17 41.5h30a3.5 3.5 0 0 1 0 7H17a3.5 3.5 0 0 1 0-7z" fill="#160800"/>
          <path class="pt" d="M18 45C21 32 31 22.5 46.5 19 43.5 32 33.5 41.5 18 45z" fill="#fff"/></svg></div>
    </div>
    <script>
      // match Telegram's day / night theme from the very first frame (no black flash in day mode)
      (function () {
        var w = window.Telegram && Telegram.WebApp;
        var pref = ''; try { pref = localStorage.getItem('aw_theme') || ''; } catch (e) {}
        var light = pref === 'light' || (pref !== 'dark' && ((w && w.colorScheme === 'light') || (!w || !w.initData) && window.matchMedia && matchMedia('(prefers-color-scheme: light)').matches));
        var bg = light ? '#F2F2F7' : '#000';
        document.documentElement.style.background = bg;
        document.getElementById('splash').style.setProperty('--sbg', bg);
        try { w && w.setHeaderColor && w.setHeaderColor(bg); w && w.setBackgroundColor && w.setBackgroundColor(bg); } catch (e) {}
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
