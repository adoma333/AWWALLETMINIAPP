# Builds the Zohra Wallet apps on GitHub's free runners and publishes them on your own server:
#   Android APK (signed with a key kept on your server) · Windows · macOS (Apple Silicon + Intel)
# The download page is https://<your domain>/get/ and installed apps offer the update themselves.
#
# One-time setup (Settings → Secrets and variables → Actions):
#   secret ZOHRA_URL          https://your-domain           (Admin panel → Ops → Apps shows both values)
#   secret ZOHRA_RELEASE_KEY  zr_…
# Then: Actions → "Build apps" → Run workflow → version (e.g. 1.0.0).
name: Build apps

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version (e.g. 1.0.0) — must be higher than the last one
        required: true
        default: 1.0.0
      notes:
        description: What's new (shown to admins)
        required: false
        default: ''
      android:
        description: Build Android
        type: boolean
        default: true
      desktop:
        description: Build Windows and macOS
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: zohra-apps
  cancel-in-progress: false

env:
  ZOHRA_URL: ${{ secrets.ZOHRA_URL }}
  ZOHRA_RELEASE_KEY: ${{ secrets.ZOHRA_RELEASE_KEY }}
  VERSION: ${{ inputs.version }}

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.v.outputs.code }}
    steps:
      - id: v
        name: Check version and server
        run: |
          [[ "$VERSION" =~ ^[0-9]{1,3}\.[0-9]{1,2}\.[0-9]{1,2}$ ]] || { echo "::error::Version must look like 1.2.3 (minor and patch up to 99)"; exit 1; }
          [ -n "$ZOHRA_URL" ] && [ -n "$ZOHRA_RELEASE_KEY" ] || { echo "::error::Add the ZOHRA_URL and ZOHRA_RELEASE_KEY secrets (Admin panel → Ops → Apps)"; exit 1; }
          IFS=. read -r A B C <<< "$VERSION"; echo "code=$((A * 10000 + B * 100 + C))" >> "$GITHUB_OUTPUT"
          curl -fsS "$ZOHRA_URL/api/releases/latest" -o latest.json || { echo "::error::Cannot reach $ZOHRA_URL"; exit 1; }
          curl -fsS -H "X-Release-Key: $ZOHRA_RELEASE_KEY" "$ZOHRA_URL/api/releases/keystore" -o /dev/null || { echo "::error::The release key was refused by $ZOHRA_URL"; exit 1; }
          cat latest.json

  android:
    needs: check
    if: inputs.android
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Signing key (kept on your server, created on the first build)
        run: |
          curl -fsS -H "X-Release-Key: $ZOHRA_RELEASE_KEY" "$ZOHRA_URL/api/releases/keystore" -o ks.json
          if [ "$(jq -r '.b64 // empty' ks.json)" = "" ]; then
            PASS=$(openssl rand -hex 16)
            keytool -genkeypair -keystore release.jks -storetype PKCS12 -alias zohra -keyalg RSA -keysize 4096 -validity 36500 \
              -storepass "$PASS" -keypass "$PASS" -dname "CN=Zohra Wallet, O=Zohra Wallet" >/dev/null
            jq -n --arg b64 "$(base64 -w0 release.jks)" --arg password "$PASS" '{b64:$b64,password:$password}' > new.json
            curl -fsS -X POST -H "X-Release-Key: $ZOHRA_RELEASE_KEY" -H "Content-Type: application/json" --data @new.json "$ZOHRA_URL/api/releases/keystore" >/dev/null \
              || curl -fsS -H "X-Release-Key: $ZOHRA_RELEASE_KEY" "$ZOHRA_URL/api/releases/keystore" -o ks.json
            rm -f new.json
          fi
          if [ -s ks.json ] && [ "$(jq -r '.b64 // empty' ks.json)" != "" ]; then
            jq -r .b64 ks.json | base64 -d > release.jks
            PASS=$(jq -r .password ks.json)
          fi
          echo "::add-mask::$PASS"
          echo "KS_PASS=$PASS" >> "$GITHUB_ENV"
          rm -f ks.json
      - name: Build APK
        run: |
          gradle -p apps/android --no-daemon assembleRelease \
            -PserverUrl="$ZOHRA_URL" -PversionCode="${{ needs.check.outputs.code }}" -PversionName="$VERSION" \
            -PstoreFile="$GITHUB_WORKSPACE/release.jks" -PstorePassword="$KS_PASS" -PkeyAlias=zohra -PkeyPassword="$KS_PASS"
          cp apps/android/app/build/outputs/apk/release/app-release.apk zohra-wallet.apk
          rm -f release.jks
          ls -la zohra-wallet.apk
      - name: Upload to your server
        run: |
          curl -fsS --retry 3 -X POST -H "X-Release-Key: $ZOHRA_RELEASE_KEY" --data-binary @zohra-wallet.apk "$ZOHRA_URL/api/releases/upload/zohra-wallet.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: android-${{ inputs.version }}
          path: zohra-wallet.apk
          retention-days: 14

  desktop:
    needs: check
    if: inputs.desktop
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Package Windows and macOS
        working-directory: apps/desktop
        run: |
          npm ci --no-audit --no-fund --loglevel=error
          jq -n --arg s "$ZOHRA_URL" '{server:$s}' > config.json
          jq --arg v "$VERSION" '.version=$v' package.json > p.json && mv p.json package.json
          PKG=(npx @electron/packager . "Zohra Wallet" --out=out --overwrite --asar --app-version="$VERSION" --ignore='^/out' --ignore='stamp-icon' --quiet)
          "${PKG[@]}" --platform=win32 --arch=x64
          "${PKG[@]}" --platform=darwin --arch=arm64 --icon=icon.icns --app-bundle-id=app.zohra.wallet --app-category-type=public.app-category.finance
          "${PKG[@]}" --platform=darwin --arch=x64 --icon=icon.icns --app-bundle-id=app.zohra.wallet --app-category-type=public.app-category.finance
          node stamp-icon.mjs "out/Zohra Wallet-win32-x64/Zohra Wallet.exe"
      - name: Ad-hoc sign the macOS apps (lets Apple Silicon open them)
        working-directory: apps/desktop
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          URL=$(curl -fsSL -H "Authorization: Bearer $GH_TOKEN" "https://api.github.com/repos/indygreg/apple-platform-rs/releases?per_page=30" \
            | grep -o 'https://[^"]*apple-codesign-[0-9.]*-x86_64-unknown-linux-musl.tar.gz' | head -1 || true)
          if [ -n "$URL" ] && curl -fsSL "$URL" -o rcs.tgz && tar -xzf rcs.tgz; then
            RCS=$(find . -type f -name rcodesign | head -1)
            for a in out/*darwin*/*.app; do "$RCS" sign "$a" && echo "signed $a" || echo "::warning::could not sign $a"; done
          else
            echo "::warning::rcodesign unavailable — macOS builds stay unsigned (right-click → Open still works)"
          fi
      - name: Zip and upload to your server
        working-directory: apps/desktop/out
        run: |
          zip -qry ../../../zohra-wallet-windows.zip "Zohra Wallet-win32-x64"
          zip -qry ../../../zohra-wallet-mac-arm64.zip "Zohra Wallet-darwin-arm64"
          zip -qry ../../../zohra-wallet-mac-x64.zip "Zohra Wallet-darwin-x64"
          cd ../../..
          for f in zohra-wallet-windows.zip zohra-wallet-mac-arm64.zip zohra-wallet-mac-x64.zip; do
            ls -la "$f"
            curl -fsS --retry 3 -X POST -H "X-Release-Key: $ZOHRA_RELEASE_KEY" --data-binary @"$f" "$ZOHRA_URL/api/releases/upload/$f"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ inputs.version }}
          path: zohra-wallet-*.zip
          retention-days: 14

  publish:
    needs: [android, desktop]
    if: always() && (needs.android.result == 'success' || needs.desktop.result == 'success')
    runs-on: ubuntu-latest
    steps:
      - name: Publish on your server (download page + in-app update)
        env:
          NOTES: ${{ inputs.notes }}
        run: |
          jq -n --arg v "$VERSION" --arg n "$NOTES" '{version:$v,notes:$n}' > body.json
          curl -fsS -X POST -H "X-Release-Key: $ZOHRA_RELEASE_KEY" -H "Content-Type: application/json" --data @body.json "$ZOHRA_URL/api/releases/publish"
          echo "Download page: $ZOHRA_URL/get/" >> "$GITHUB_STEP_SUMMARY"
