# Builds the Mini App, admin panel and download page on GitHub (fast, free) on every push, and publishes the result
# as the asset `web-dist.tar.gz` of the pre-release `web-<branch>`. `aw-wallet update` on the server downloads that
# ready build instead of compiling on the (small) server, and swaps it in at once — no 500 page while updating.
name: Web build

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: web-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: cd frontend && npm ci --no-audit --no-fund && npm run build
      - name: Package
        run: |
          test -f frontend/dist/index.html
          echo "${GITHUB_SHA}" > frontend/dist/commit.txt
          tar -czf web-dist.tar.gz -C frontend/dist .
          sha256sum web-dist.tar.gz | cut -d' ' -f1 > web-dist.sha256
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="web-${GITHUB_REF_NAME//\//-}"
          gh release view "$TAG" >/dev/null 2>&1 || \
            gh release create "$TAG" --prerelease --target "$GITHUB_SHA" --title "Web build ($GITHUB_REF_NAME)" \
              --notes "Built automatically. Used by aw-wallet update on the server."
          gh release upload "$TAG" web-dist.tar.gz web-dist.sha256 --clobber
